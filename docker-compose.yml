# General Operations Checklist - run full stack with Docker
# Usage: docker compose up --build
# App: http://localhost:80  (frontend; /api proxied to backend)

services:
  mongo:
    image: mongo:7
    container_name: gen_cl_mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gen_cl_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/gen_cl
      JWT_SECRET: general-checklist-jwt-secret-min-32-characters-long-for-docker
      CORS_ORIGIN: http://localhost
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gen_cl_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
